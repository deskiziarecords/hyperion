[package]
name = "hyperion-sentinel"
version = "0.1.0"
edition = "2021"

[lib]
name = "hyperion_sentinel"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
pyo3 = { version = "0.20", features = ["extension-module", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
anyhow = "1.0"
tracing = "0.1"
parking_lot_rt = { version = "0.12", package = "parking_lot" } # ensure consistency
