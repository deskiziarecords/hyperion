[package]
name = "quimeria-hyperion"
version = "0.1.0"
edition = "2021"

[lib]
name = "quimeria_hyperion"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hyperion-demo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
pyo3 = { version = "0.22", features = ["extension-module", "chrono", "abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
anyhow = "1.0"
tracing = "0.1"
dotenvy = "0.15"
redis = { version = "0.24", features = ["tokio-comp", "streams", "json"] }
